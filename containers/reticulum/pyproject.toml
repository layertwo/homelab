[project]
name = "reticulum"
version = "0.1.0"
description = "Runtime image for rnsd (Reticulum transport node) and lxmd (LXMF propagation node)"
requires-python = ">=3.14"
dependencies = [
    "rns==1.5.4",
    "lxmf==1.1.1",
]

[tool.uv]
# Deps-only image: there is no package here to build or install.
package = false
