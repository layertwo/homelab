[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oidc-saml-bridge"
version = "0.1.0"
dependencies = [
    "flask==3.1.3",
    "authlib==1.6.9",
    "lxml==6.0.4",
    "signxml==4.4.0",
    "cryptography==46.0.7",
    "requests==2.33.1",
    "gunicorn==25.3.0",
    "PyJWT==2.12.1",
    "MarkupSafe==3.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "black==26.3.1",
    "isort==8.0.1",
    "flake8==7.3.0",
    "Flake8-pyproject==1.2.4",
    "responses==0.26.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=100"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
]
branch = true
parallel = true
relative_files = true

[tool.black]
line-length = 100
target-version = ["py312"]
src = ["src/", "tests/"]

[tool.isort]
profile = "black"
src_paths = ["src"]
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203"]
