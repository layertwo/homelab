# IMPORTANT: This file needs to be encrypted with SOPS before committing!
#
# Steps to configure:
# 1. Generate SAML signing certificate:
#    openssl genrsa -out saml.key 2048
#    openssl req -new -x509 -key saml.key -out saml.crt -days 365 -sha256 -subj "/CN=aws-sso.layertwo.dev"
#
# 2. Create OIDC client "aws-sso-bridge" in pocket-id with:
#    - Redirect URI: https://aws-sso.layertwo.dev/callback
#    - Scopes: openid, profile, email, groups
#
# 3. Generate Flask secret key:
#    python3 -c "import secrets; print(secrets.token_hex(32))"
#
# 4. Fill in the values below and encrypt:
#    sops -e -i clusters/home/apps/sso/pocket-id/saml-bridge/secrets-saml-bridge.sops.yml
#
