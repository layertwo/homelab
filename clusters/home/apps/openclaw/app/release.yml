---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw
  namespace: openclaw
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          openclaw:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: latest
            env:
              TZ: America/New_York
            ports:
              - name: http
                containerPort: 18789
                protocol: TCP
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: http
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            enabled: true
            port: 18789
            protocol: HTTP
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: "ReadWriteOnce"
        size: 10Gi
        globalMounts:
          - path: /home/openclaw/.openclaw
