---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: flux-system
  interval: 30m
  timeout: 5m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    redis-cluster:
      enabled: false
    redis:
      enabled: false
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false

    persistence:
      enabled: true
      storageClass: sunbeam-iscsi-csi
      accessModes:
        - ReadWriteOnce
      size: 256Gi

    gitea:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      readinessProbe:
        enabled: true
      livenessProbe:
        enabled: true
      startupProbe:
        enabled: true
      metrics:
        enabled: false
      admin:
        existingSecret: secrets-forgejo-admin

      oauth:
      - name: "pocket-id"
        provider: "openidConnect"
        autoDiscoverUrl: "https://idp.layertwo.dev/.well-known/openid-configuration"
        scopes: "openid email profile"
        existingSecret: secrets-forgejo-oidc

      config:
        database:
          DB_TYPE: postgres
        actions:
          ENABLED: true
        indexer:
          ISSUE_INDEXER_TYPE: bleve
          REPO_INDEXER_ENABLED: true
        server:
          DOMAIN: code.layertwo.dev
          SSH_DISABLE: true
          ROOT_URL: https://code.layertwo.dev
          LANDING_PAGE: explore
        repository:
          DEFAULT_BRANCH: main
          DEFAULT_PRIVATE: true
        repository.pull-request:
          DEFAULT_DELETE_BRANCH_AFTER_MERGE: true
          DEFAULT_MERGE_STYLE: squash
        admin:
          DISABLE_REGULAR_ORG_CREATION: true
        service:
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          DEFAULT_ENABLE_TIMETRACKING: false
          ENABLE_INTERNAL_SIGNIN: false
          DEFAULT_KEEP_EMAIL_PRIVATE: true
          DISABLE_REGISTRATION: false
          ENABLE_PASSKEY_AUTHENTICATION: false
          ENABLE_PASSWORD_SIGNIN_FORM: false
          SHOW_REGISTRATION_BUTTON: false
          REQUIRE_SIGNIN_VIEW: true
        cron:
          ENABLED: true

        storage: &s3
          STORAGE_TYPE: minio
          MINIO_ENDPOINT: s3.layertwo.dev
          MINIO_BUCKET: forgejo
          MINIO_LOCATION: garage
          MINIO_USE_SSL: true
        attachment: *s3
        #mailer:
        #  ENABLED: true
        #  PROTOCOL: smtp
        #  SMTP_ADDR: smtp-relay.networking.svc.cluster.local
        #  SMTP_PORT: 2525
        #  FROM: "Forgejo <git@${SECRET_DOMAIN}>"
        cache:
          ENABLED: true
          ADAPTER: redis
        queue:
          TYPE: redis
        session:
          PROVIDER: redis
        openid:
          ENABLE_OPENID_SIGNIN: false
          ENABLE_OPENID_SIGNUP: true
          UPDATE_AVATAR: true
          WHITELISTED_URIS: idp.layertwo.dev
        other:
          SHOW_FOOTER_TEMPLATE_LOAD_TIME: false
          SHOW_FOOTER_VERSION: false
          SHOW_FOOTER_POWERED_BY: false
        security:
          LOGIN_REMEMBER_DAYS: 7
        ui:
          SHOW_USER_EMAIL: false
        api:
          ENABLE_SWAGGER: false
        repository.signing:
          FORMAT: ssh
          SIGNING_KEY: /data/git/.ssh-signing/key.pub
          SIGNING_NAME: Forgejo
          SIGNING_EMAIL: git@code.layertwo.dev
          INITIAL_COMMIT: pubkey
          WIKI: never
          CRUD_ACTIONS: pubkey, parentsigned
          MERGES: pubkey

      additionalConfigFromEnvs:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secrets-forgejo-valkey
              key: password
        - name: FORGEJO__cache__HOST
          value: "redis://:$(VALKEY_PASSWORD)@forgejo-valkey:6379/0"
        - name: FORGEJO__queue__CONN_STR
          value: "redis://:$(VALKEY_PASSWORD)@forgejo-valkey:6379/1"
        - name: FORGEJO__session__PROVIDER_CONFIG
          value: "redis://:$(VALKEY_PASSWORD)@forgejo-valkey:6379/2"
        - name: FORGEJO__storage__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: secrets-forgejo-s3
              key: access-key
        - name: FORGEJO__storage__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: secrets-forgejo-s3
              key: secret-key
        - name: FORGEJO__attachment__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: secrets-forgejo-s3
              key: access-key
        - name: FORGEJO__attachment__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: secrets-forgejo-s3
              key: secret-key
        - name: FORGEJO__DATABASE__USER
          valueFrom:
            secretKeyRef:
              name: cnpg-forgejo-app
              key: user
        - name: FORGEJO__DATABASE__NAME
          valueFrom:
            secretKeyRef:
              name: cnpg-forgejo-app
              key: dbname
        - name: FORGEJO__DATABASE__HOST
          valueFrom:
            secretKeyRef:
              name: cnpg-forgejo-app
              key: host
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: cnpg-forgejo-app
              key: password

    signing:
      enabled: true
      ssh:
        existingSecret: secrets-forgejo-signing

    ingress:
      enabled: false

    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"

