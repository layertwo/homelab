---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: flux-system
  interval: 30m
  timeout: 5m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    redis-cluster:
      enabled: false
    redis:
      enabled: false
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false

    persistence:
      enabled: true
      storageClass: sunbeam-iscsi-csi
      accessModes:
        - ReadWriteOnce
      size: 256Gi

    gitea:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      readinessProbe:
        enabled: true
      livenessProbe:
        enabled: true
      startupProbe:
        enabled: true
      metrics:
        enabled: false
      admin:
        existingSecret: secrets-forgejo-admin

      oauth:
      - name: "pocket-id"
        provider: "openidConnect"
        autoDiscoverUrl: "https://idp.layertwo.dev/.well-known/openid-configuration"
        scopes: "openid email profile"
        existingSecret: secrets-forgejo-oidc

      config:
        database:
          DB_TYPE: postgres
        indexer:
          ISSUE_INDEXER_TYPE: bleve
          REPO_INDEXER_ENABLED: true
      additionalConfigFromEnvs:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secrets-forgejo-valkey
              key: password
        - name: FORGEJO__cache__ADAPTER
          value: redis
        - name: FORGEJO__cache__HOST
          value: "redis://:$(VALKEY_PASSWORD)@forgejo-valkey:6379/0"
        - name: FORGEJO__queue__TYPE
          value: redis
        - name: FORGEJO__queue__CONN_STR
          value: "redis://:$(VALKEY_PASSWORD)@forgejo-valkey:6379/1"
        - name: FORGEJO__SERVICE__DISABLE_REGISTRATION
          value: "false"
        - name: FORGEJO__SERVICE__ALLOW_ONLY_EXTERNAL_REGISTRATION
          value: "true"
        - name: FORGEJO__SERVICE__SHOW_REGISTRATION_BUTTON
          value: "false"
        - name: FORGEJO__SERVICE__REQUIRE_SIGNIN_VIEW
          value: "true"
        - name: FORGEJO__openid__ENABLE_OPENID_SIGNIN
          value: "false"
        - name: FORGEJO__openid__ENABLE_OPENID_SIGNUP
          value: "true"
        - name: FORGEJO__openid__WHITELISTED_URIS
          value: "idp.layertwo.dev"
        - name: FORGEJO__DATABASE__USER
          valueFrom:
            secretKeyRef:
              name: cnpg-forgejo-app
              key: user
        - name: FORGEJO__DATABASE__NAME
          valueFrom:
            secretKeyRef:
              name: cnpg-forgejo-app
              key: dbname
        - name: FORGEJO__DATABASE__HOST
          valueFrom:
            secretKeyRef:
              name: cnpg-forgejo-app
              key: host
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: cnpg-forgejo-app
              key: password
        - name: FORGEJO__server__DOMAIN
          value: code.layertwo.dev
        - name: FORGEJO__server__ROOT_URL
          value: https://code.layertwo.dev
        - name: FORGEJO__server__SSH_DOMAIN
          value: ssh.code.layertwo.dev
        - name: FORGEJO__server__SSH_PORT
          value: "22"
        - name: FORGEJO__security__LOGIN_REMEMBER_DAYS
          value: "7"
        - name: FORGEJO__other__SHOW_FOOTER_VERSION
          value: "false"
        - name: FORGEJO__other__SHOW_FOOTER_TEMPLATE_LOAD_TIME
          value: "false"
        - name: FORGEJO__other__SHOW_FOOTER_POWERED_BY
          value: "false"
        - name: FORGEJO__api__ENABLE_SWAGGER
          value: "false"
        - name: FORGEJO__EXPLORE__DISABLE_USERS_PAGE
          value: "true"

    service:
      ssh:
        type: LoadBalancer
        annotations:
          metallb.io/address-pool: external
        externalTrafficPolicy: Cluster

    ingress:
      enabled: false

    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "2000m"

