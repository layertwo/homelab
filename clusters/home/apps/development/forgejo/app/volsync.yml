---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  sourcePVC: gitea-shared-storage
  trigger:
    schedule: "30 4 * * *"
  restic:
    repository: secrets-forgejo-volsync
    copyMethod: Snapshot
    volumeSnapshotClassName: sunbeam-iscsi-csi
    storageClassName: sunbeam-iscsi-csi
    cacheCapacity: 1Gi
    cacheStorageClassName: sunbeam-iscsi-csi
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
