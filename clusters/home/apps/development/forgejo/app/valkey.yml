---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-valkey
  namespace: forgejo
spec:
  interval: 30m
  chart:
    spec:
      chart: valkey
      version: 0.9.3
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    architecture: standalone
    auth:
      enabled: true
      usersExistingSecret: secrets-forgejo-valkey
      aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: password
    dataStorage:
      enabled: true
      storageClass: sunbeam-iscsi-csi
      size: 4Gi
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
