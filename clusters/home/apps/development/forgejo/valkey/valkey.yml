---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-valkey
  namespace: forgejo
spec:
  interval: 30m
  chart:
    spec:
      chart: valkey
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"
    architecture: standalone
    auth:
      enabled: true
      usersExistingSecret: secrets-forgejo-valkey
      aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: password
        replication:
          permissions: "+psync +replconf +ping"
          passwordKey: replication-password
    replica:
      enabled: true
      replicas: 1
      replicationUser: replication
      persistence:
        size: 1Gi
        storageClass: sunbeam-iscsi-csi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: valkey
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
