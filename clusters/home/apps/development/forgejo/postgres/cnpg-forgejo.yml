---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-forgejo
  namespace: forgejo
spec:
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://layertwo-dev-cloudnativepg/
      endpointURL: https://62eaebf5ed37822b342914fbdc45a08d.r2.cloudflarestorage.com
      serverName: forgejo
      s3Credentials:
        accessKeyId:
          name: &secretName secrets-cloudnativepg-r2
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: *secretName
          key: SECRET_ACCESS_KEY
  instances: 2
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15
  storage:
    storageClass: sunbeam-iscsi-csi
    size: 256Gi
  walStorage:
    storageClass: sunbeam-iscsi-csi
    size: 10Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
  postgresql:
    parameters:
      # WAL management parameters to prevent disk space issues
      wal_keep_size: "1GB"
      max_wal_size: "2GB"
      checkpoint_completion_target: "0.9"
      archive_timeout: "300s"
