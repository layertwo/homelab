---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cloudtak-internal
  namespace: tak
  annotations:
    external-dns.alpha.kubernetes.io/enabled: "true"
    external-dns.alpha.kubernetes.io/hostname: "cloudtak.layertwo.dev"
    external-dns.alpha.kubernetes.io/target: "proxy-internal.layertwo.dev"
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    kubernetes.io/ingress.class: internal
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cloudtak.layertwo.dev`)
      kind: Rule
      services:
        - name: cloudtak-api
          port: 5000
