---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudtak
  namespace: tak
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"
    controllers:
      api:
        containers:
          api:
            image:
              repository: ghcr.io/dfpc-coe/cloudtak-api
              tag: v13.78.2
              pullPolicy: IfNotPresent
            env:
              API_URL: "https://cloudtak.layertwo.dev"
              CLOUDTAK_Config_media_url: "http://cloudtak-media.tak.svc.cluster.local:9997"
              PMTILES_URL: "http://cloudtak-tiles.tak.svc.cluster.local:5002"
              ASSET_BUCKET: "cloudtak"
              AWS_S3_Endpoint: "https://s3.layertwo.dev"
              AWS_REGION: "garage"
              SigningSecret:
                secretKeyRef:
                  name: secrets-cloudtak
                  key: SIGNING_SECRET
              POSTGRES:
                secretKeyRef:
                  name: cnpg-cloudtak-app
                  key: uri
              AWS_S3_AccessKeyId:
                secretKeyRef:
                  name: secrets-cloudtak
                  key: AWS_S3_ACCESS_KEY_ID
              AWS_S3_SecretAccessKey:
                secretKeyRef:
                  name: secrets-cloudtak
                  key: AWS_S3_SECRET_ACCESS_KEY
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
      tiles:
        containers:
          tiles:
            image:
              repository: ghcr.io/dfpc-coe/cloudtak-pmtiles
              tag: v13.78.2
              pullPolicy: IfNotPresent
            env:
              ASSET_BUCKET: "cloudtak"
              AWS_S3_Endpoint: "https://s3.layertwo.dev"
              AWS_REGION: "garage"
              SigningSecret:
                secretKeyRef:
                  name: secrets-cloudtak
                  key: SIGNING_SECRET
              AWS_S3_AccessKeyId:
                secretKeyRef:
                  name: secrets-cloudtak
                  key: AWS_S3_ACCESS_KEY_ID
              AWS_S3_SecretAccessKey:
                secretKeyRef:
                  name: secrets-cloudtak
                  key: AWS_S3_SECRET_ACCESS_KEY
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
      media:
        containers:
          media:
            image:
              repository: ghcr.io/dfpc-coe/media-infra
              tag: v9.11.0
              pullPolicy: IfNotPresent
            env:
              API_URL: "https://cloudtak.layertwo.dev"
              CLOUDTAK_Config_media_url: "http://cloudtak-media:9997"
              SigningSecret:
                secretKeyRef:
                  name: secrets-cloudtak
                  key: SIGNING_SECRET
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      api:
        controller: api
        ports:
          http:
            port: 5000
            protocol: HTTP
      tiles:
        controller: tiles
        ports:
          http:
            port: 5002
            protocol: HTTP
      media:
        controller: media
        ports:
          api:
            port: 9997
            protocol: HTTP
      media-tcp:
        controller: media
        type: LoadBalancer
        annotations:
          metallb.universe.tf/address-pool: external
          metallb.universe.tf/allow-shared-ip: cloudtak-media
          external-dns.alpha.kubernetes.io/enabled: "true"
          external-dns.alpha.kubernetes.io/hostname: "media.cloudtak.layertwo.dev"
          layertwo.dev/publish: "internal"
        ports:
          rtsp:
            port: 8554
            protocol: TCP
          rtmp:
            port: 1935
            protocol: TCP
          hls:
            port: 8888
            protocol: TCP
      media-udp:
        controller: media
        type: LoadBalancer
        annotations:
          metallb.universe.tf/address-pool: external
          metallb.universe.tf/allow-shared-ip: cloudtak-media
        ports:
          srt:
            port: 8890
            protocol: UDP
