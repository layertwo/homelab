---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rabbitmq
  namespace: tak
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        annotations:
          secret.reloader.stakater.com/reload: secrets-rabbitmq-app
        containers:
          rabbitmq:
            image:
              repository: public.ecr.aws/docker/library/rabbitmq
              tag: 4.2.3-management
              pullPolicy: IfNotPresent
            env:
              RABBITMQ_DEFAULT_USER:
                valueFrom:
                  secretKeyRef:
                    name: secrets-rabbitmq-app
                    key: RABBITMQ_USERNAME
              RABBITMQ_DEFAULT_PASS:
                valueFrom:
                  secretKeyRef:
                    name: secrets-rabbitmq-app
                    key: RABBITMQ_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
    service:
      rabbitmq:
        enabled: true
        controller: main
        ports:
          amqp:
            enabled: true
            port: 5672
            protocol: TCP
          management:
            enabled: true
            port: 15672
            protocol: TCP
    persistence:
      data:
        enabled: true
        type: emptyDir
        globalMounts:
        - path: /var/lib/rabbitmq