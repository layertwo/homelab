---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mediamtx
  namespace: tak
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        annotations:
          secret.reloader.stakater.com/reload: mediamtx-config
        containers:
          mediamtx:
            image:
              repository: bluenviron/mediamtx
              tag: 1.15.6-ffmpeg
              pullPolicy: IfNotPresent
            env:
              MTX_PROTOCOLS: "tcp"
              MTX_ENCRYPTION: "no"
              MTX_SERVERKEY: "/certs/server.key"
              MTX_SERVERCERT: "/certs/server.crt"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
    service:
      mediamtx:
        enabled: true
        controller: main
        ports:
          rtsp:
            enabled: true
            port: 8554
            protocol: TCP
          rtmp:
            enabled: true
            port: 1935
            protocol: TCP
          hls:
            enabled: true
            port: 8888
            protocol: TCP
          webrtc:
            enabled: true
            port: 8889
            protocol: TCP
          api:
            enabled: true
            port: 9997
            protocol: TCP
    persistence:
      recordings:
        enabled: true
        storageClass: sunbeam-iscsi-csi
        accessMode: "ReadWriteOnce"
        size: 100Gi
        globalMounts:
        - path: /recordings
      certs:
        enabled: true
        storageClass: sunbeam-iscsi-csi
        accessMode: "ReadWriteOnce"
        size: 1Gi
        globalMounts:
          - path: /certs
      config:
        enabled: true
        type: configMap
        name: mediamtx-config
        globalMounts:
          - path: /mediamtx.yml
            subPath: mediamtx.yml
