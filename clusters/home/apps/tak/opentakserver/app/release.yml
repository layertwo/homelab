---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentakserver
  namespace: tak
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        annotations:
          secret.reloader.stakater.com/reload: "auto"
        containers:
          opentakserver:
            image:
              repository: ghcr.io/layertwo/opentakserver
              tag: latest
              pullPolicy: IfNotPresent
            env:
              SQLALCHEMY_DATABASE_URI:
                secretKeyRef:
                  name: cnpg-opentakserver-app
                  key: uri
              OTS_DATA_FOLDER: "/var/lib/opentakserver"
              OTS_RABBITMQ_SERVER_ADDRESS: "rabbitmq.tak"
              OTS_RABBITMQ_USERNAME:
                secretKeyRef:
                  name: secrets-rabbitmq-app
                  key: RABBITMQ_USERNAME
              OTS_RABBITMQ_PASSWORD:
                secretKeyRef:
                  name: secrets-rabbitmq-app
                  key: RABBITMQ_PASSWORD
              OTS_FQDN: "tak.layertwo.dev"
              OTS_LISTENER_ADDRESS: "0.0.0.0"
              OTS_LISTENER_PORT: &port 8081
              DEBUG: "true"
              OTS_UI_FOLDER : "/var/lib/opentakserver/ui"
              OTS_MEDIAMTX_ENABLE: "true"
              OTS_ENABLE_PLUGINS: "false"
              OTS_MEDIAMTX_API_ADDRESS: "http://mediamtx.tak:9997"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1024Mi
    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            enabled: true
            port: *port
            protocol: HTTP
    persistence:
      data:
        enabled: true
        storageClass: sunbeam-iscsi-csi
        accessMode: "ReadWriteOnce"
        size: 32Gi
        globalMounts:
          - path: /var/lib/opentakserver
      logs:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /var/lib/opentakserver/logs
