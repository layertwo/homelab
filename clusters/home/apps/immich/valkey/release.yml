---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-valkey
  namespace: immich
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.2.0-alpine
            command:
              - sh
            args:
              - -c
              - >-
                valkey-server --requirepass $VALKEY_PASSWORD
            env:
              VALKEY_PORT: &port 6379
            envFrom:
              - secretRef:
                  name: secrets-immich-valkey
            resources:
              requests:
                cpu: 5m
                memory: 128M
              limits:
                memory: 256M
    service:
      main:
        enabled: true
        controller: main
        ports:
          valkey:
            enabled: true
            port: *port
