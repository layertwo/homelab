---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-immich
  namespace: immich
spec:
  instances: 2
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      # WAL management parameters to prevent disk space issues
      wal_keep_size: "1GB"
      max_wal_size: "2GB"
      checkpoint_completion_target: "0.9"
      archive_timeout: "300s"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 4Gi
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
  storage:
    storageClass: sunbeam-nfs-csi
    size: 4Gi
  walStorage:
    storageClass: sunbeam-nfs-csi
    size: 10Gi
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://layertwo-dev-cloudnativepg/
      endpointURL: https://62eaebf5ed37822b342914fbdc45a08d.r2.cloudflarestorage.com
      serverName: immich
      s3Credentials:
        accessKeyId:
          name: &secretName secrets-cloudnativepg-r2
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: *secretName
          key: SECRET_ACCESS_KEY
