---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-prowlarr
  namespace: mediabox
spec:
  instances: 2
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  imageName: ghcr.io/cloudnative-pg/postgresql:16.9
  bootstrap:
    initdb:
      database: prowlarr_main
      owner: prowlarr
  storage:
    storageClass: sunbeam-nfs-csi
    size: 4Gi
  walStorage:
    storageClass: sunbeam-nfs-csi
    size: 10Gi
  postgresql:
    parameters:
      # WAL management parameters to prevent disk space issues
      wal_keep_size: "1GB"
      max_wal_size: "2GB"
      checkpoint_completion_target: "0.9"
      archive_timeout: "300s"
