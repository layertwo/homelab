---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: mediabox
spec:
  timeout: 10m
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  values:
    controllers:
      main:
        type: deployment
        containers:
          jellyfin:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.11
            env:
              TZ: Etc/UTC
              UMASK: "0022"
              UMASK_SET: "0022"
              # NVENC/NVDEC needs `video`, the CUDA HDR tone-mapper needs `compute`.
              # Defaulting to `utility` gives a working nvidia-smi and broken transcoding.
              NVIDIA_VISIBLE_DEVICES: all
              NVIDIA_DRIVER_CAPABILITIES: all
              S6_READ_ONLY_ROOT: "1"
              JELLYFIN_PublishedServerUrl: http://127.0.0.1:8096
              MALLOC_TRIM_THRESHOLD_: 100000
            securityContext:
              readOnlyRootFilesystem: true
              privileged: true
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
                ephemeral-storage: 1Gi
              limits:
                memory: 12Gi
                ephemeral-storage: 2Gi
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 109
              - 568
          # NFD's built-in PCI source: class 0300 (VGA) + vendor 10de (NVIDIA).
          # Self-maintaining — picks up any future GPU node with no manifest change.
          nodeSelector:
            feature.node.kubernetes.io/pci-0300_10de.present: "true"
          runtimeClassName: nvidia
    defaultPodOptions:
      dnsConfig:
        nameservers:
          - 1.1.1.1
        options:
          - { name: ndots, value: "1" }
    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            enabled: true
            port: 8096
            protocol: HTTP
      autodiscovery:
        enabled: true
        controller: main
        ports:
          autodiscovery:
            enabled: true
            port: 7359
            protocol: UDP
    persistence:
      config:
        enabled: true
        forceRename: jellyfin-config
        storageClass: sunbeam-nfs-csi
        accessMode: "ReadWriteOnce"
        size: 32Gi
        advancedMounts:
          main:
            jellyfin:
              - path: /config
      cache:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: &limit 8Gi
        advancedMounts:
          main:
            jellyfin:
              - path: /cache
      tmp:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: *limit
        advancedMounts:
          main:
            jellyfin:
              - path: /tmp
      varlogs:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: *limit
        advancedMounts:
          main:
            jellyfin:
              - path: /var/logs
      varrun:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: *limit
        advancedMounts:
          main:
            jellyfin:
              - path: /var/run
      transcode:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: *limit
        advancedMounts:
          main:
            jellyfin:
              - path: /config/transcode
      devdri:
        enabled: true
        type: hostPath
        hostPathType: Directory
        hostPath: /dev/dri
      media:
        type: nfs
        server: sunbeam.layertwo.lan
        path: /mnt/storage0/media
        advancedMounts:
          main:
            jellyfin:
            - path: /movies
              subPath: movies
            - path: /tv
              subPath: tv
