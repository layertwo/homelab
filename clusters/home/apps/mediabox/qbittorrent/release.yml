---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: mediabox
spec:
  timeout: 10m
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  values:
    controllers:
      main:
        type: deployment
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          qbittorrent:
            dependsOn: port-forward
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3
            env:
              TZ: Etc/UTC
              # Only QBT_<CLI_OPTION_NAME> vars work (see `qbittorrent-nox --help`).
              # Everything else -- save paths, network interface, WebUI auth -- has no
              # CLI flag, so it lives only in qBittorrent.conf on the config PVC.
              QBT_WEBUI_PORT: &port 9091
              QBT_TORRENTING_PORT: &btPort 50413
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsGroup: 568
              runAsNonRoot: true
              runAsUser: 568
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 1Gi
              limits:
                memory: 1024Mi
                ephemeral-storage: 2Gi
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
              pullPolicy: IfNotPresent
            env:
              TZ: Etc/UTC
              UPDATER_PERIOD: 24h
              HEALTH_VPN_DURATION_INITIAL: 30s
              HEALTH_SUCCESS_WAIT_DURATION: 30s
            envFrom:
              - secretRef:
                  name: gluetun-secret
            securityContext:
              privileged: true
              capabilities:
                add:
                - NET_ADMIN
                - SYS_MODULE
            resources:
              requests:
                memory: 256Mi
                cpu: 250m
          port-forward:
            dependsOn: gluetun
            image:
              repository: docker.io/snoringdragon/gluetun-qbittorrent-port-manager
              tag: "1.3@sha256:679b7a92c494f93b78ad37ef24f3a261e73d0a1a52505ad4f1e39580eedfa14f"
              pullPolicy: IfNotPresent
            env:
              # localhost, not the service name: gluetun points the pod's resolv.conf at
              # its own DoT resolver, which cannot resolve cluster services. /etc/hosts
              # covers localhost, and all containers share the pod netns.
              QBITTORRENT_SERVER: localhost
              QBITTORRENT_PORT: *port
              PORT_FORWARDED: "/tmp/gluetun/forwarded_port"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                memory: 256Mi
                cpu: 250m
    defaultPodOptions:
      dnsConfig:
        nameservers:
          - 1.1.1.1
        options:
          - { name: ndots, value: "1" }
    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            enabled: true
            port: *port
            protocol: HTTP
          torrent:
            enabled: false
            port: *btPort
            protocol: TCP
    persistence:
      config:
        enabled: true
        forceRename: qbittorrent-config
        storageClass: sunbeam-nfs-csi
        accessMode: "ReadWriteOnce"
        size: 1Gi
        advancedMounts:
          main:
            qbittorrent:
              - path: /config
      gluetun-config:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 32Mi
        advancedMounts:
          main:
            gluetun:
              - path: /gluetun
      gluetun-data:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        advancedMounts:
          main:
            gluetun:
              - path: /tmp/gluetun
            port-forward:
              - path: /tmp/gluetun
                readOnly: true
      media:
        type: nfs
        server: sunbeam.layertwo.lan
        path: /mnt/storage0/media
        advancedMounts:
          main:
            qbittorrent:
            - path: /data/downloads
              subPath: downloads

