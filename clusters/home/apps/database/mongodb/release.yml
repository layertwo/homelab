---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: mongodb-kubernetes
      version: 1.11.0
      sourceRef:
        kind: HelmRepository
        name: mongodb
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    operator:
      watchedResources:
        - mongodbcommunity
