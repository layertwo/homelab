---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scylla
  namespace: scylla-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: scylla-operator
      version: v1.22.0
      sourceRef:
        kind: HelmRepository
        name: scylla
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
