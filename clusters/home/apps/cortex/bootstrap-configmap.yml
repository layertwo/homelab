---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-bootstrap
data:
  bootstrap.py: |
    """Create Cortex's DynamoDB-compatible tables in ScyllaDB Alternator."""

    import os
    import time

    import boto3
    from botocore.exceptions import ClientError

    DATA_TABLE = os.environ["VAULTS_TABLE_NAME"]
    SHARES_TABLE = os.environ["SHARES_TABLE_NAME"]

    DATA_ATTRIBUTES = [
        {"AttributeName": "PK", "AttributeType": "S"},
        {"AttributeName": "SK", "AttributeType": "S"},
        {"AttributeName": "GSI1PK", "AttributeType": "S"},
        {"AttributeName": "GSI1SK", "AttributeType": "S"},
        {"AttributeName": "GSI2PK", "AttributeType": "S"},
        {"AttributeName": "GSI2SK", "AttributeType": "S"},
    ]


    def client():
        # Alternator has its own key, separate from Garage's S3 credentials.
        return boto3.client(
            "dynamodb",
            aws_access_key_id=os.environ["DYNAMODB_ACCESS_KEY_ID"],
            aws_secret_access_key=os.environ["DYNAMODB_SECRET_ACCESS_KEY"],
        )


    def wait_for_alternator():
        for _ in range(180):
            try:
                client().list_tables()
                return
            except Exception as exc:
                print(f"waiting for Alternator: {type(exc).__name__}", flush=True)
                time.sleep(5)
        raise SystemExit("Alternator did not become reachable")


    def create(name, **kwargs):
        try:
            client().create_table(TableName=name, **kwargs)
            print(f"created {name}", flush=True)
        except ClientError as exc:
            if exc.response["Error"]["Code"] != "ResourceInUseException":
                raise
            print(f"{name} already exists", flush=True)


    wait_for_alternator()

    create(
        DATA_TABLE,
        AttributeDefinitions=DATA_ATTRIBUTES,
        KeySchema=[
            {"AttributeName": "PK", "KeyType": "HASH"},
            {"AttributeName": "SK", "KeyType": "RANGE"},
        ],
        GlobalSecondaryIndexes=[
            {
                "IndexName": "GSI1",
                "KeySchema": [
                    {"AttributeName": "GSI1PK", "KeyType": "HASH"},
                    {"AttributeName": "GSI1SK", "KeyType": "RANGE"},
                ],
                "Projection": {"ProjectionType": "ALL"},
            },
            {
                "IndexName": "GSI2",
                "KeySchema": [
                    {"AttributeName": "GSI2PK", "KeyType": "HASH"},
                    {"AttributeName": "GSI2SK", "KeyType": "RANGE"},
                ],
                "Projection": {"ProjectionType": "ALL"},
            },
        ],
        ProvisionedThroughput={"ReadCapacityUnits": 5, "WriteCapacityUnits": 5},
    )

    create(
        SHARES_TABLE,
        AttributeDefinitions=[
            {"AttributeName": "PK", "AttributeType": "S"},
            {"AttributeName": "SK", "AttributeType": "S"},
        ],
        KeySchema=[
            {"AttributeName": "PK", "KeyType": "HASH"},
            {"AttributeName": "SK", "KeyType": "RANGE"},
        ],
        ProvisionedThroughput={"ReadCapacityUnits": 5, "WriteCapacityUnits": 5},
    )

    # Pending uploads and expired shares rely on TTL. Alternator may not expose the
    # TTL API; keep going and let the operator's expiration scan handle the attribute.
    try:
        client().update_time_to_live(
            TableName=SHARES_TABLE,
            TimeToLiveSpecification={"Enabled": True, "AttributeName": "ttl"},
        )
        print("TTL enabled on shares", flush=True)
    except Exception as exc:
        print(f"TTL API unavailable ({type(exc).__name__})", flush=True)
