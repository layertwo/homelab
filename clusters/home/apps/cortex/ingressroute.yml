---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cortex
  annotations:
    external-dns.kubernetes.io/hostname: "cortex.layertwo.dev"
    external-dns.kubernetes.io/target: "proxy-external.layertwo.dev"
    external-dns.kubernetes.io/cloudflare-proxied: "false"
    layertwo.dev/publish: "all"
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    kubernetes.io/ingress.class: external
spec:
  entryPoints:
    - websecure
  routes:
    # The SPA boots from /v1/config and calls the API same-origin; everything else
    # (including /s/<share> and /auth/callback) is served by the static web image.
    - match: Host(`cortex.layertwo.dev`) && PathPrefix(`/v1`)
      kind: Rule
      priority: 100
      services:
        - name: cortex-api
          port: 8000
    - match: Host(`cortex.layertwo.dev`)
      kind: Rule
      priority: 1
      services:
        - name: cortex-web
          port: 80
  tls:
    secretName: cortex-layertwo-dev-tls
