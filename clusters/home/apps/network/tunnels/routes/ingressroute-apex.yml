---
# Native control goes directly to frps; only the broker's public endpoints are routed.
# `/api/machines` is deliberately absent: the broker mounts those handlers only when the machines
# feature is configured, and it answers 404 until then, so a route for it would do nothing. Add it
# beside `/api/me` when machines are switched on.
# The *.layertwo.dev default certificate covers this host, so there is no tls block.
#
# DNS-only, like the sites and the ssh host: the other two records already publish the origin
# address, so proxying this one hides nothing, and it keeps Cloudflare out of the control
# channel's path — no 100 s idle-WebSocket limit, and one less hop for every agent connection.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tunnels-apex
  namespace: tunnels
  annotations:
    external-dns.kubernetes.io/hostname: "tunnels.layertwo.dev"
    external-dns.kubernetes.io/target: "proxy-external.layertwo.dev"
    external-dns.kubernetes.io/cloudflare-proxied: "false"
    layertwo.dev/publish: "all"
    kubernetes.io/ingress.class: external
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`tunnels.layertwo.dev`) && PathPrefix(`/~!frp`)
    kind: Rule
    middlewares:
    - name: tunnels-ratelimit
    - name: tunnels-inflight
    services:
    - name: frps
      port: control
  - match: Host(`tunnels.layertwo.dev`) && (Path(`/api/me`) || Path(`/api/shares`) || Path(`/.well-known/tunnels.json`) || Path(`/healthz`))
    kind: Rule
    middlewares:
    - name: tunnels-ratelimit
    - name: tunnels-inflight
    services:
    - name: broker
      port: http
