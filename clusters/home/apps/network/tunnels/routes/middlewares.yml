---
# Never let a visitor supply identity for the login gate or the tunneled app.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tunnels-strip-identity
  namespace: tunnels
spec:
  headers:
    customRequestHeaders:
      X-Tunnels-Sub: ""
      X-Tunnels-User: ""
      X-Tunnels-Groups: ""
      X-Tunnel-User: ""
---
# Login gate for every site: Pocket ID via the traefik-oidc-auth plugin.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tunnels-oidc
  namespace: tunnels
spec:
  plugin:
    oidc:
      Secret: "urn:k8s:secret:secrets-tunnels-oidc:pluginSecret"
      Provider:
        Url: "https://idp.layertwo.dev/"
        ClientId: "urn:k8s:secret:secrets-tunnels-oidc:clientId"
        ClientSecret: "urn:k8s:secret:secrets-tunnels-oidc:clientSecret"
        UsePkce: true
      Scopes: ["openid", "profile", "groups"]
      # Not __Host-: with PKCE, plugin v0.21.0 sets its CodeVerifier cookie on Path=/oidc/callback,
      # which browsers reject for __Host- names (login then fails). Switch back once the plugin
      # keeps the verifier in the OIDC state (merged upstream in #283, unreleased).
      CookieNamePrefix: "__Secure-tunnels"
      Authorization:
        # Without this the groups are checked once at login and cached while tokens renew silently
        CheckOnEveryRequest: true
        AssertClaims:
          - Name: groups
            AnyOf: ["tunnels-viewers", "tunnels-creators"]
      # Identity is for the broker's authorization decision, not the creator's app.
      # Phase 1 is owner-only and does not need the visitor's groups downstream.
      Headers:
        - Name: X-Tunnels-Sub
          Value: "{{ .claims.sub }}"
        - Name: X-Tunnels-User
          Value: "{{ .claims.preferred_username }}"
        - Name: X-Tunnels-Groups
          Values: "{{ .claims.groups | mapToJsonArray }}"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tunnels-authz
  namespace: tunnels
spec:
  forwardAuth:
    # Fully qualified: Traefik runs in traefik-system, where a bare "broker" does not resolve.
    address: http://broker.tunnels.svc.cluster.local:8080/authz
    trustForwardHeader: false
    # Existing copies are removed before Traefik applies the broker's response.
    # The broker returns only X-Tunnel-User; internal identity is not forwarded.
    authResponseHeaders:
      - X-Tunnels-Sub
      - X-Tunnels-User
      - X-Tunnel-User
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tunnels-strip-internal
  namespace: tunnels
spec:
  headers:
    customRequestHeaders:
      X-Tunnels-Sub: ""
      X-Tunnels-User: ""
      X-Tunnels-Groups: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tunnels-ratelimit
  namespace: tunnels
spec:
  rateLimit:
    average: 50
    burst: 100
    period: 1s
    sourceCriterion:
      requestHost: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tunnels-inflight
  namespace: tunnels
spec:
  inFlightReq:
    amount: 100
    sourceCriterion:
      requestHost: true
