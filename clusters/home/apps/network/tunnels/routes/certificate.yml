---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tunnels-sites
  namespace: tunnels
spec:
  secretName: tunnels-sites-tls
  dnsNames:
    - "*.w.tunnels.layertwo.dev"
  issuerRef:
    name: letsencrypt-prod-dns
    kind: ClusterIssuer
---
# Every SSH tunnel is published at this one host, so this is a single name rather than the
# wildcard it replaced. One level below tunnels.layertwo.dev like the sites, and Cloudflare's
# free certificate covers neither, so it is issued over DNS-01 too.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tunnels-ssh
  namespace: tunnels
spec:
  secretName: tunnels-ssh-tls
  dnsNames:
    - ssh.tunnels.layertwo.dev
  issuerRef:
    name: letsencrypt-prod-dns
    kind: ClusterIssuer
