---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frps
  namespace: tunnels
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

    controllers:
      main:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          frps:
            image:
              repository: ghcr.io/layertwo/tunnels-frps
              tag: v0.1.0@sha256:1cd411e9941d4e73ceb888cdb7061489d544867d53350069625546cf4c1d8992
            args: ["-c", "/etc/frp/frps.toml"]
            env:
              FRPS_DASHBOARD_PASSWORD:
                secretKeyRef:
                  name: secrets-tunnels-broker
                  key: FRPS_DASHBOARD_PASSWORD
              PLUGIN_SECRET:
                secretKeyRef:
                  name: secrets-tunnels-broker
                  key: PLUGIN_SECRET
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7000
              readiness: *probe
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    service:
      main:
        controller: main
        ports:
          control:
            port: 7000
            protocol: TCP
          vhost:
            port: 8080
            protocol: HTTP
          dashboard:
            port: 7500
            protocol: HTTP

    persistence:
      config:
        type: configMap
        name: frps-config
        globalMounts:
          - path: /etc/frp
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
