---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frps-config
  namespace: tunnels
data:
  frps.toml: |
    bindPort = 7000
    vhostHTTPPort = 8080
    subDomainHost = "w.tunnels.layertwo.dev"
    auth.method = "oidc"
    auth.oidc.issuer = "https://idp.layertwo.dev"
    auth.oidc.audience = "https://tunnels.layertwo.dev"
    auth.additionalScopes = ["HeartBeats"]
    transport.heartbeatTimeout = 90
    # 7000 is frps' own listener, so no TCP proxy can ever bind it
    allowPorts = [{ single = 7000 }]
    log.to = "console"
    log.level = "info"
