---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frps-config
  namespace: tunnels
data:
  frps.toml: |
    bindPort = 7000
    vhostHTTPPort = 8080
    subDomainHost = "w.tunnels.layertwo.dev"
    auth.method = "oidc"
    auth.oidc.issuer = "https://idp.layertwo.dev"
    auth.oidc.audience = "https://tunnels.layertwo.dev"
    auth.additionalScopes = ["HeartBeats", "NewWorkConns"]
    transport.heartbeatTimeout = 90
    # frps holds port 7000 itself, so no TCP proxy can bind an allowed port.
    allowPorts = [{ single = 7000 }]
    log.to = "console"
    log.level = "info"

    webServer.addr = "0.0.0.0"
    webServer.port = 7500
    webServer.user = "broker"
    webServer.password = "{{ .Envs.FRPS_DASHBOARD_PASSWORD }}"
    enablePrometheus = true

    [[httpPlugins]]
    name = "broker"
    addr = "http://broker:8080"
    path = "/plugin/{{ .Envs.PLUGIN_SECRET }}"
    ops = ["Login", "NewProxy", "CloseProxy"]
