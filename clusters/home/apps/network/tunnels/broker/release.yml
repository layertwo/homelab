---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: broker
  namespace: tunnels
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          broker:
            image:
              repository: ghcr.io/layertwo/tunnels-broker
              tag: v0.2.0@sha256:f9ad79f7db427808240cc85e202fd5b12cf3f9551e36625299b9758fcf08397e
            env:
              SERVICE_HOST: tunnels.layertwo.dev
              SITES_DOMAIN: w.tunnels.layertwo.dev
              ISSUER: https://idp.layertwo.dev
              API_RESOURCE: https://tunnels.layertwo.dev
              CREATORS_GROUP: tunnels-creators
              CLI_CLIENT_ID: dbf1099c-ebad-4c97-b1da-137372140feb
              MIN_CLI_VERSION: "0.1.0"
              DATABASE_URL:
                secretKeyRef:
                  name: cnpg-tunnels-app
                  key: uri
              FRPS_DASHBOARD_URL: http://frps:7500
              FRPS_DASHBOARD_USER: broker
              MAX_TUNNELS_PER_USER: "5"
              DEFAULT_BANDWIDTH_LIMIT: 10MB
              LISTEN_ADDR: ":8080"
              LOG_LEVEL: info
            envFrom:
              - secretRef:
                  name: secrets-tunnels-broker
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
              readiness: *probe
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
            protocol: HTTP
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
