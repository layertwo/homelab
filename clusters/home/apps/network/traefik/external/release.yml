---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-external
  namespace: traefik-system
spec:
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: 41.4.0
  interval: 60m
  timeout: 10m
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  values:
    ports:
      web:
        port: 80
        transport:
          respondingTimeouts:
            readTimeout: 0s
        forwardedHeaders:
          # Trust Cloudflare IP ranges so the real client IP is propagated downstream
          trustedIPs: &cloudflareIPs
            # IPv4 — https://www.cloudflare.com/ips-v4
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            # IPv6 — https://www.cloudflare.com/ips-v6
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
        http:
          redirections:
            to: websecure
            scheme: https
      websecure:
        port: 443
        asDefault: true
        transport:
          respondingTimeouts:
            readTimeout: 0s
        forwardedHeaders:
          trustedIPs: *cloudflareIPs
        http:
          tls:
            enabled: true
          middlewares:
            - traefik-system-secure-headers-middleware

    tlsStore:
      default:
        certificates:
          - secretName: wildcard-layertwo-dev-tls
        defaultCertificate:
          secretName: wildcard-layertwo-dev-tls

    tlsOptions:
      default:
        minVersion: VersionTLS12
        maxVersion: VersionTLS13
        sniStrict: true
        curvePreferences:
          - "X25519"
          - "CurveP256"
          - "CurveP384"
        cipherSuites:
          - "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
          - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
          - "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
          - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
          - "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305"
          - "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"

    service:
      spec:
        externalTrafficPolicy: Local
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        external-dns.alpha.kubernetes.io/hostname: "proxy-external.layertwo.dev"
        # publish proxy-external.layertwo.dev to internal dns
        layertwo.dev/publish: "internal"
        metallb.io/address-pool: external
        metallb.io/loadBalancerIPs: "172.31.0.30"

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

    ingressClass:
      enabled: true
      isDefaultClass: false
      name: &ingressName external

    ingressRoute:
      dashboard:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/enabled: "true"
          external-dns.alpha.kubernetes.io/hostname: "traefik-external.layertwo.dev"
          layertwo.dev/publish: "internal"
        entryPoints: ["websecure"]
        matchRule: Host(`traefik-external.layertwo.dev`)

    providers:

      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
        ingressClass: *ingressName

      kubernetesIngress:
        enabled: true
        ingressClass: *ingressName
        publishedService:
          enabled: false

    accessLog:
      enabled: true

    experimental:
      plugins:
        oidc:
          moduleName: github.com/sevensolutions/traefik-oidc-auth
          # renovate: datasource=github-releases depName=sevensolutions/traefik-oidc-auth
          version: v0.21.0
