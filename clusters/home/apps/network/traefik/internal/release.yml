---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: traefik-system
spec:
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: 41.4.0
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  interval: 60m
  timeout: 10m
  values:
    ports:
      web:
        port: 80
        transport:
          respondingTimeouts:
            readTimeout: 0s
        http:
          redirections:
            to: websecure
            scheme: https
      websecure:
        port: 443
        asDefault: true
        transport:
          respondingTimeouts:
            readTimeout: 0s
        http:
          tls:
            enabled: true
          middlewares:
            - traefik-system-secure-headers-middleware

    service:
      spec:
        externalTrafficPolicy: Local
      annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
        external-dns.alpha.kubernetes.io/hostname: "proxy-internal.layertwo.dev"
        layertwo.dev/publish: "internal"
        kubernetes.io/ingress.class: &ingressName internal
        metallb.io/address-pool: internal
        metallb.io/loadBalancerIPs: "172.31.0.20"

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

    ingressClass:
      enabled: true
      isDefaultClass: true
      name: *ingressName

    ingressRoute:
      dashboard:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/enabled: "true"
          external-dns.alpha.kubernetes.io/hostname: "traefik-internal.layertwo.dev"
          external-dns.alpha.kubernetes.io/target: "proxy-internal.layertwo.dev"
          layertwo.dev/publish: "internal"
          kubernetes.io/ingress.class: *ingressName
        entryPoints: ["websecure"]
        matchRule: Host(`traefik-internal.layertwo.dev`)

    providers:

      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
        allowExternalNameServices: true
        ingressClass: *ingressName

      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
        ingressClass: *ingressName
        publishedService:
          enabled: false

    accessLog:
      enabled: true
