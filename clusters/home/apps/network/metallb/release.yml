---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  chart:
    spec:
      chart: metallb
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      version: 0.16.1
  interval: 60m
  values:
    controller:
      nodeSelector:
        location: home
    speaker:
      nodeSelector:
        location: home
      frr:
        enabled: false
    frrk8s:
      enabled: false
