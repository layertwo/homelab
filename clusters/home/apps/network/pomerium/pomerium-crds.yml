---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pomerium-crds
  namespace: flux-system
spec:
  interval: 15m
  path: "./config/default"
  prune: true
  sourceRef:
    kind: GitRepository
    name: pomerium-ingress-controller-crds
    namespace: flux-system

  patches:
  - patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname
        value: pom.layertwo.dev
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1enabled
        value: true
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod-dns
      - op: add
        path: /metadata/annotations/kubernetes.io~1ingress.class
        value: internal
      - op: add
        path: /metadata/annotations/metallb.io~1address-pool
        value: internal

    target:
      kind: Service
      name: pomerium-proxy

  - patch: |
      - op: replace
        path: /spec/replicas
        value: 2

    target:
      kind: Deployment
      name: pomerium