---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-tududi
  namespace: tududi
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  enableSuperuserAccess: true
  storage:
    storageClass: sunbeam-nfs-csi
    size: 2Gi
  bootstrap:
    initdb:
      database: tududi
      owner: tududi
