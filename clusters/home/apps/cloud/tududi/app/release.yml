---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tududi
  namespace: tududi
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        fsGroup: 1001

    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: docker.io/chrisvel/tududi
              tag: 1.9.7
            env:
              BASE_URL: https://tasks.layertwo.dev
              TUDUDI_ALLOWED_ORIGINS: https://tasks.layertwo.dev
              TUDUDI_TRUST_PROXY: "1"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: cnpg-tududi-app
                    key: fqdn-uri
              OIDC_ENABLED: "true"
              OIDC_PROVIDER_NAME: Pocket ID
              OIDC_PROVIDER_SLUG: pocketid
              OIDC_ISSUER_URL: https://idp.layertwo.dev
              OIDC_SCOPE: openid profile email
              OIDC_AUTO_PROVISION: "true"
            envFrom:
              - secretRef:
                  name: secrets-tududi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &httpPort 3002
                  periodSeconds: 5
                  failureThreshold: 60
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *httpPort
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probe
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      main:
        controller: main
        ports:
          http:
            enabled: true
            primary: true
            port: *httpPort
            protocol: HTTP

    persistence:
      uploads:
        enabled: true
        type: persistentVolumeClaim
        storageClass: sunbeam-nfs-csi
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /app/uploads
