---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stoat-garage-config
  namespace: stoat
data:
  garage.toml: |
    replication_factor = 1

    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"

    db_engine = "sqlite"

    rpc_bind_addr = "[::]:3901"

    [s3_api]
    api_bind_addr = "[::]:3900"
    s3_region = "garage"
    root_domain = ".s3.garage"

    [s3_web]
    bind_addr = "[::]:3902"

    [admin]
    api_bind_addr = "[::]:3903"
