---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stoat-livekit-config
  namespace: stoat
data:
  livekit.yml: |
    rtc:
      use_external_ip: true
      port_range_start: 50000
      port_range_end: 50100
      tcp_port: 7881
    turn:
      enabled: false
    redis:
      address: stoat-redis.stoat.svc.cluster.local:6379
