---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kirocrew
  namespace: kirocrew
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"

    controllers:
      main:
        type: deployment
        strategy: Recreate
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          gateway:
            image: &image
              repository: ghcr.io/layertwo/kirocrew-opencode
              tag: 0.12.2@sha256:7f3469ceb8fa8efa8f3b5426661f761e765b0bd4f176a6de3258d4ac9b1cca30
            env:
              TZ: Etc/UTC
              HOME: /home/kirocrew
              KIROCREW_CORS_ORIGINS: https://kiro.layertwo.dev
              KIROCREW_TELEMETRY_DISABLED: 1
              OPENCODE_CONFIG: /config/opencode.json
            envFrom:
              - secretRef:
                  name: secrets-kirocrew
                  optional: true
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &dashboardPort 5476
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *dashboardPort
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 500m
                memory: 3Gi
              limits:
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              appArmorProfile:
                type: Localhost
                localhostProfile: kirocrew-userns
              seccompProfile:
                type: Localhost
                localhostProfile: profiles/kirocrew-seccomp.json

          # Remote Crew: sshd on the pod's loopback, published by the tunnel agent below.
          # Loops like the tunnel sidecar: a crashing sidecar unreadies the pod and the gateway with it.
          sshd:
            image: *image
            command: ["/bin/sh", "-c"]
            args:
              - |
                k=/home/kirocrew/.sshd/host_ed25519
                while :; do
                  if [ ! -x /usr/sbin/sshd ]; then echo "sshd not in image" >&2
                  elif [ -f "$k" ] || { mkdir -p "${k%/*}" && ssh-keygen -q -t ed25519 -N '' -f "$k"; }; then
                    /usr/sbin/sshd -D -e -f /etc/kirocrew-sshd/sshd_config
                  fi
                  sleep 30
                done
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 128Mi
            securityContext: &sidecarSecurity
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault

          # Loops instead of exiting so a missing machine key or dropped tunnel never unreadies the pod.
          tunnel:
            image: *image
            command: ["/bin/sh", "-c"]
            args:
              - |
                until [ -f "$TUNNELS_CONFIG_DIR/machine-key.json" ]; do sleep 30; done
                while :; do tunnel up 2222 --ssh; sleep 10; done
            env:
              TUNNELS_CONFIG_DIR: /home/kirocrew/.config/tunnels
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext: *sidecarSecurity

    service:
      main:
        enabled: true
        controller: main
        ports:
          dashboard:
            enabled: true
            primary: true
            port: *dashboardPort
            protocol: HTTP

    persistence:
      data:
        enabled: true
        existingClaim: kirocrew-data
        globalMounts:
          - path: /home/kirocrew
      opencode-config:
        enabled: true
        type: configMap
        name: kirocrew-opencode-config
        globalMounts:
          - path: /config
      sshd-config:
        enabled: true
        type: configMap
        name: kirocrew-sshd-config
        advancedMounts:
          main:
            sshd:
              - path: /etc/kirocrew-sshd
                readOnly: true
      sshd-run:
        enabled: true
        type: emptyDir
        advancedMounts:
          main:
            sshd:
              - path: /run/sshd
