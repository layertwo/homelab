---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kirocrew
  namespace: kirocrew
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"

    controllers:
      main:
        type: deployment
        strategy: Recreate
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          gateway:
            image:
              repository: ghcr.io/layertwo/kirocrew-opencode
              tag: latest@sha256:8167b691a0ca7105ccb0f2221a1e9ae7b3473065a8257839545be50f54edf484
            env:
              TZ: Etc/UTC
              HOME: /home/kirocrew
              KIROCREW_CORS_ORIGINS: https://kiro.layertwo.dev
              KIROCREW_TELEMETRY_DISABLED: 1
              OPENCODE_CONFIG: /config/opencode.json
            envFrom:
              - secretRef:
                  name: secrets-kirocrew
                  optional: true
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &dashboardPort 5476
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *dashboardPort
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 500m
                memory: 3Gi
              limits:
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              appArmorProfile:
                type: Localhost
                localhostProfile: kirocrew-userns
              seccompProfile:
                type: Localhost
                localhostProfile: profiles/kirocrew-seccomp.json

    service:
      main:
        enabled: true
        controller: main
        ports:
          dashboard:
            enabled: true
            primary: true
            port: *dashboardPort
            protocol: HTTP

    persistence:
      data:
        enabled: true
        existingClaim: kirocrew-data
        globalMounts:
          - path: /home/kirocrew
      opencode-config:
        enabled: true
        type: configMap
        name: kirocrew-opencode-config
        globalMounts:
          - path: /config
