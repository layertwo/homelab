---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kirocrew
  namespace: kirocrew
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"

    controllers:
      main:
        type: deployment
        strategy: Recreate
        pod:
          securityContext:
            # Non-root, no extra capabilities. This used to run as root with
            # SYS_ADMIN + an unconfined AppArmor profile to try to get the
            # inner user-namespace sandbox (unshare(CLONE_NEWUSER) + uid_map)
            # working -- confirmed via pod logs that it can't work on this
            # node regardless: kernel.apparmor_restrict_unprivileged_userns=1
            # blocks unprivileged userns creation at the kernel/AppArmor
            # level, which no container-level capability or appArmorProfile
            # setting can override. We run unsandboxed instead
            # (KIROCREW_ALLOW_UNSANDBOXED=1 below, upstream's documented
            # posture for locked-down/managed Kubernetes), so nothing here
            # needs root or SYS_ADMIN anymore.
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          # KiroCrew apps install skills into ~/.kiro/crew/skills at runtime
          # (nested one level under per-app wrapper dirs, often as symlinks
          # into site-packages). opencode only discovers skills one level
          # deep at ~/.config/opencode/skills/<name>/SKILL.md, so re-link
          # them into place before the gateway starts, on every pod boot.
          # find -L follows symlinks so app-installed skills are picked up;
          # ln -sfn makes it idempotent.
          link-opencode-skills:
            image:
              repository: busybox
              tag: latest
            command:
              - /bin/sh
              - -c
            args:
              - |
                set -eu
                mkdir -p "$HOME/.config/opencode/skills"
                [ -d "$HOME/.kiro/crew/skills" ] || exit 0
                find -L "$HOME/.kiro/crew/skills" -name SKILL.md \
                  -exec sh -c 'd="${1%/SKILL.md}"; ln -sfn "$d" "$HOME/.config/opencode/skills/${d##*/}"' _ {} \;
            env:
              HOME:
                value: /home/kirocrew
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          gateway:
            image:
              repository: ghcr.io/layertwo/kirocrew-opencode
              tag: latest@sha256:ac7e0f4a947181fa11f7e5e05d106fc12064cefe1bb57922797e956adb81159c
            env:
              TZ: Etc/UTC
              # entrypoint.sh resolves its data home from $HOME (via the
              # product's ensure_data_home()); pinning it here keeps that
              # resolution (credential .env scrubbing, legacy-home migration
              # marker) on the kirocrew-data PVC instead of the container's
              # ephemeral root filesystem.
              HOME: /home/kirocrew
              KIROCREW_KIRO_BIN: /usr/local/bin/kirocrew-shim
              KIROCREW_CORS_ORIGINS: https://kiro.layertwo.dev
              KIROCREW_ALLOW_UNSANDBOXED: 1
              KIROCREW_TELEMETRY_DISABLED: 1
              OPENCODE_MODEL: ollama-cloud/gpt-oss:120b
              OPENCODE_CONFIG: /config/opencode.json
            envFrom:
              - secretRef:
                  name: secrets-kirocrew
                  optional: true
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &dashboardPort 5476
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *dashboardPort
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]

    service:
      main:
        enabled: true
        controller: main
        ports:
          dashboard:
            enabled: true
            primary: true
            port: *dashboardPort
            protocol: HTTP

    persistence:
      data:
        enabled: true
        existingClaim: kirocrew-data
        globalMounts:
          - path: /home/kirocrew
      opencode-config:
        enabled: true
        type: configMap
        name: kirocrew-opencode-config
        globalMounts:
          - path: /config
