---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-nextcloud
  namespace: nextcloud
spec:
  instances: 2
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15
  postgresql:
    parameters:
      wal_keep_size: "1GB"
      max_wal_size: "2GB"
      checkpoint_completion_target: "0.9"
      archive_timeout: "300s"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
  storage:
    storageClass: sunbeam-nfs-csi
    size: 10Gi
  walStorage:
    storageClass: sunbeam-nfs-csi
    size: 10Gi
