---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 30m
  timeout: 20m
  chart:
    spec:
      chart: nextcloud
      version: 9.4.0
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RetryOnFailure
  dependsOn:
    - name: nextcloud-valkey
      namespace: nextcloud
  values:
    phpClientHttpsFix:
      enabled: true
      protocol: https

    ingress:
      enabled: false

    nextcloud:
      host: cloud.layertwo.dev
      update: 1
      podSecurityContext:
        fsGroup: 33
        # Default `Always` recursively chowns the whole (28k-file, NFS-backed)
        # html tree on every pod start — and the cron job runs every 5 min, so it
        # redoes it constantly. Only change ownership if the volume root differs.
        fsGroupChangePolicy: OnRootMismatch
      trustedDomains:
        - cloud.layertwo.dev
        - nextcloud.nextcloud.svc.cluster.local
      existingSecret:
        enabled: true
        secretName: secrets-nextcloud-admin
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
      extraEnv:
        - name: TRUSTED_PROXIES
          value: "10.42.0.0/16 10.43.0.0/16 172.31.0.0/24"
        - name: OVERWRITEHOST
          value: cloud.layertwo.dev
        - name: OVERWRITECLIURL
          value: https://cloud.layertwo.dev
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: secrets-nextcloud-oidc
              key: client-id
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: secrets-nextcloud-oidc
              key: client-secret

      # TrueNAS media tree, read-only: Nextcloud shares these files by link and
      # never writes, so it cannot desync Sonarr/Radarr/Jellyfin, which mount the
      # same export directly. Surfaced as External Storage from the hook below.
      extraVolumes:
        - name: truenas-media
          nfs:
            server: sunbeam.layertwo.lan
            path: /mnt/storage0/media
            readOnly: true
      extraVolumeMounts:
        - name: truenas-media
          mountPath: /media
          readOnly: true

      objectStore:
        s3:
          enabled: true
          host: garage-truenas.garage.svc.cluster.local
          bucket: nextcloud
          port: "30188"
          ssl: false
          region: garage
          usePathStyle: true
          autoCreate: false
          storageClass: STANDARD
          existingSecret: secrets-nextcloud-s3
          secretKeys:
            accessKey: S3_ACCESS_KEY
            secretKey: S3_SECRET_KEY
      hooks:
        before-starting: |
          #!/bin/sh
          set -u
          occ() { php /var/www/html/occ "$@"; }

          occ app:enable user_oidc 2>/dev/null \
            || occ app:install user_oidc \
            || echo "[oidc] ERROR: could not install or enable user_oidc - OIDC login unavailable"

          occ user_oidc:provider pocket-id \
            --clientid="$OIDC_CLIENT_ID" \
            --clientsecret-env=OIDC_CLIENT_SECRET \
            --discoveryuri="https://idp.layertwo.dev/.well-known/openid-configuration" \
            --scope="openid profile email" \
            --mapping-uid=sub \
            --unique-uid=0 \
            || echo "[oidc] ERROR: provider upsert failed - OIDC login unavailable"

          # The IdP resolves to a private IP (MetalLB/Traefik); Nextcloud's HTTP
          # client refuses local hosts unless this is enabled.
          occ config:system:set allow_local_remote_servers --value=true --type=boolean \
            || echo "[oidc] ERROR: could not allow local remote servers - OIDC login may fail"

          # External storage: surface the TrueNAS media tree (read-only NFS mount
          # at /media) so its files can be link-shared. Guarded so re-runs are free;
          # Nextcloud escapes "/" in its JSON output, hence the literal \/.
          mount_if_missing() { # <name> <datadir>
            occ files_external:list --output=json 2>/dev/null \
              | grep -qF "\"mount_point\":\"\\/$1\"" && return 0
            occ files_external:create "$1" local null::null -c "datadir=$2" >/dev/null \
              || echo "[files_external] ERROR: could not add $1 mount"
          }
          mount_if_missing Movies /media/movies
          mount_if_missing TV /media/tv
          if [ -d /media/games ]; then mount_if_missing Games /media/games; fi

    # Gate liveness/readiness during the (slow, NFS-backed) first-boot install;
    # the default 10s delay + 3 failures restarts the container before it can finish.
    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60

    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      existingSecret:
        enabled: true
        secretName: cnpg-nextcloud-app
        hostKey: host
        databaseKey: dbname
        usernameKey: user
        passwordKey: password

    redis:
      enabled: false
    externalRedis:
      enabled: true
      host: nextcloud-valkey.nextcloud.svc.cluster.local
      port: "6379"
      existingSecret:
        enabled: true
        secretName: secrets-nextcloud-valkey
        passwordKey: password

    mariadb:
      enabled: false
    postgresql:
      enabled: false
    collabora-online:
      enabled: false

    persistence:
      enabled: true
      storageClass: sunbeam-nfs-csi
      accessMode: ReadWriteMany
      size: 8Gi
      nextcloudData:
        enabled: false

    cronjob:
      enabled: true
      type: cronjob
      cronjob:
        # Nextcloud's console refuses to run as root when config.php is owned by
        # www-data, so the cron job must run as the same user (uid 33).
        securityContext:
          runAsUser: 33
          runAsGroup: 33

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
