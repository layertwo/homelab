---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    replication_factor = 1

    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"

    db_engine = "lmdb"

    rpc_bind_addr = "[::]:3901"
    rpc_secret = "${GARAGE_RPC_SECRET}"

    [s3_api]
    api_bind_addr = "[::]:3900"
    s3_region = "garage"
    root_domain = ".s3.layertwo.dev"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".s3-website.layertwo.dev"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "${GARAGE_ADMIN_TOKEN}"
