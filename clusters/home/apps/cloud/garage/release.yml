---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
  namespace: garage
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.0.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  values:
    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"
    controllers:
      main:
        initContainers:
          render-config:
            image:
              repository: docker.io/busybox
              tag: latest
            command:
              - sh
            args:
              - -c
              - |
                sed \
                  -e "s|\${GARAGE_RPC_SECRET}|${GARAGE_RPC_SECRET}|g" \
                  -e "s|\${GARAGE_ADMIN_TOKEN}|${GARAGE_ADMIN_TOKEN}|g" \
                  /config-template/garage.toml > /config/garage.toml
            env:
              GARAGE_RPC_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: secrets-garage
                    key: GARAGE_RPC_SECRET
              GARAGE_ADMIN_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: secrets-garage
                    key: GARAGE_ADMIN_TOKEN
        containers:
          main:
            image:
              repository: dxflrs/garage
              tag: v2.3.0
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3903
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3903
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 64M
              limits:
                memory: 256M
    service:
      main:
        enabled: true
        controller: main
        ports:
          s3:
            enabled: true
            port: 3900
          rpc:
            enabled: true
            port: 3901
          web:
            enabled: true
            port: 3902
          admin:
            enabled: true
            port: 3903
    persistence:
      config-template:
        enabled: true
        type: configMap
        name: garage-config
        advancedMounts:
          main:
            render-config:
              - path: /config-template
                readOnly: true
      config:
        enabled: true
        type: emptyDir
        advancedMounts:
          main:
            render-config:
              - path: /config
            main:
              - path: /etc/garage.toml
                subPath: garage.toml
                readOnly: true
      meta:
        enabled: true
        globalMounts:
          - path: /var/lib/garage/meta
        existingClaim: garage-metadata
      data:
        enabled: true
        globalMounts:
          - path: /var/lib/garage/data
        existingClaim: garage-data
