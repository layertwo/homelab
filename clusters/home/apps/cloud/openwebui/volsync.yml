---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: open-webui
  namespace: openwebui
spec:
  sourcePVC: open-webui
  trigger:
    schedule: "0 4 * * *"
  restic:
    repository: secrets-open-webui-volsync
    copyMethod: Snapshot
    volumeSnapshotClassName: sunbeam-nfs-csi
    storageClassName: sunbeam-nfs-csi
    cacheCapacity: 2Gi
    cacheStorageClassName: sunbeam-nfs-csi
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    moverSecurityContext:
      runAsUser: 3001
      runAsGroup: 3001
      fsGroup: 3001
      fsGroupChangePolicy: OnRootMismatch
