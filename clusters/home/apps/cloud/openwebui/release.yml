---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: openwebui
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: open-webui
      version: 16.0.0
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"

    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 2Gi

    ollama:
      enabled: false

    pipelines:
      enabled: false

    tika:
      enabled: false

    websocket:
      enabled: true
      manager: redis
      redis:
        enabled: true

    ingress:
      enabled: false

    persistence:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteMany
      storageClass: sunbeam-nfs-csi

    enableOpenaiApi: true
    openaiBaseApiUrls:
      - http://hermes.hermes.svc.cluster.local:8642/v1
    openaiApiKeysExistingSecret: secrets-openwebui
    openaiApiKeysExistingSecretKey: OPENAI_API_KEYS

    extraEnvVars:
      - name: WEBUI_URL
        value: https://pythia.layertwo.dev
      - name: ENABLE_SIGNUP
        value: "false"

    sso:
      enabled: true
      enableSignup: false
      oidc:
        enabled: true
        providerName: layertwo
        providerUrl: https://idp.layertwo.dev/.well-known/openid-configuration
        scopes: "openid email profile"
        clientExistingSecret: secrets-openwebui
        clientIdExistingSecretKey: OAUTH_CLIENT_ID
        clientExistingSecretKey: OAUTH_CLIENT_SECRET
