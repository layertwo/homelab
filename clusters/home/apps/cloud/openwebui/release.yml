---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: openwebui
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: open-webui
      version: 16.0.0
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"

    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 2Gi

    # gpu.enabled is deliberately off: it would add a nvidia.com/gpu resource limit,
    # and this cluster runs no device plugin. The card is reached via runtimeClassName
    # plus NVIDIA_VISIBLE_DEVICES, the same way jellyfin does it.
    ollama:
      enabled: true
      runtimeClassName: nvidia
      ollama:
        gpu:
          enabled: false
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
      extraEnv:
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_KEEP_ALIVE
          value: 5m
        - name: OLLAMA_FLASH_ATTENTION
          value: "1"
        # Qwen3.5 head_dim is 256, so KV costs 128 KiB/token at f16 and ollama
        # auto-sizes to 4096. q8_0 halves it; 16384 then fits in ~1 GiB.
        # q8_0 requires flash attention above.
        - name: OLLAMA_KV_CACHE_TYPE
          value: q8_0
        - name: OLLAMA_CONTEXT_LENGTH
          value: "16384"
      persistentVolume:
        enabled: true
        size: 60Gi
        storageClass: sunbeam-nfs-csi
        accessModes:
          - ReadWriteOnce
      resources:
        requests:
          cpu: 200m
          memory: 2Gi
        limits:
          memory: 8Gi

    pipelines:
      enabled: false

    tika:
      enabled: false

    websocket:
      enabled: true
      manager: redis
      redis:
        enabled: true

    ingress:
      enabled: false

    persistence:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteMany
      storageClass: sunbeam-nfs-csi

    enableOpenaiApi: true
    openaiBaseApiUrls:
      - http://hermes.hermes.svc.cluster.local:8642/v1
    openaiApiKeysExistingSecret: secrets-openwebui
    openaiApiKeysExistingSecretKey: OPENAI_API_KEYS

    extraEnvVars:
      - name: WEBUI_URL
        value: https://pythia.layertwo.dev
      - name: ENABLE_SIGNUP
        value: "false"

    sso:
      enabled: true
      enableSignup: false
      oidc:
        enabled: true
        providerName: layertwo
        providerUrl: https://idp.layertwo.dev/.well-known/openid-configuration
        scopes: "openid email profile"
        clientExistingSecret: secrets-openwebui
        clientIdExistingSecretKey: OAUTH_CLIENT_ID
        clientExistingSecretKey: OAUTH_CLIENT_SECRET
