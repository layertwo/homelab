---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lxmd-config
  namespace: reticulum
data:
  config: |
    [propagation]
    enable_node = yes
    node_name = layertwo Propagation Node
    announce_at_start = yes
    announce_interval = 360
    # MB. The emptyDir sizeLimit in release.yml is 2Gi; keep a margin for ratchets
    # and local-delivery files.
    message_storage_limit = 1000
    # IFAC on the hub already decides who can reach this node.
    auth_required = no

    [lxmf]
    display_name = layertwo Propagation Node

    [logging]
    loglevel = 4
