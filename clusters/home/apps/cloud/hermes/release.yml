---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  namespace: hermes
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"

    controllers:
      main:
        type: deployment
        strategy: Recreate
        pod:
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          gateway:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.8.27
            args: ["gateway", "run"]
            env:
              TZ: Etc/UTC
              HERMES_HOME: /opt/data
              OLLAMA_BASE_URL: https://ollama.com/v1
              GATEWAY_ALLOW_ALL_USERS: "false"
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_MODEL_NAME: hermes-agent
            envFrom:
              - secretRef:
                  name: secrets-hermes
                  optional: true
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &dashboardPort 9119
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *dashboardPort
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 3Gi

    service:
      main:
        enabled: true
        controller: main
        ports:
          dashboard:
            enabled: true
            primary: true
            port: *dashboardPort
            protocol: HTTP
          api:
            enabled: true
            port: 8642
            protocol: HTTP

    persistence:
      data:
        enabled: true
        existingClaim: hermes-data
        globalMounts:
          - path: /opt/data
