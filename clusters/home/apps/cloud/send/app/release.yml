---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: send
  namespace: send
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          send:
            image:
              repository: registry.gitlab.com/timvisee/send
              tag: v3.4.25
            env:
              TZ: Etc/UTC
              BASE_URL: https://send.layertwo.dev
              PORT: 8080
              MAX_FILE_SIZE: 10737418240
              REDIS_HOSTNAME: send-redis.send.svc.cluster.local
              REDIS_PORT: 6379
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: secrets-send-redis
                    key: SEND_REDIS_PASSWORD
    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            enabled: true
            port: 8080
            protocol: HTTP
    persistence:
      config:
        enabled: true
        storageClass: sunbeam-nfs-csi
        accessMode: "ReadWriteOnce"
        size: 256Gi
        globalMounts:
          - path: /uploads
