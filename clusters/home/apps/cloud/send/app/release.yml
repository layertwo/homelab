---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: send
  namespace: send
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      dnsConfig:
        options:
          - name: ndots
            value: "1"

    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          send:
            image:
              repository: registry.gitlab.com/timvisee/send
              tag: v3.4.27
            env:
              TZ: Etc/UTC
              NODE_ENV: production
              BASE_URL: https://send.layertwo.dev
              PORT: 8080
              MAX_FILE_SIZE: 10737418240
              MAX_DOWNLOADS: 10
              DEFAULT_EXPIRE_SECONDS: 86400
              REDIS_HOST: send-redis.send.svc.cluster.local
              REDIS_PORT: 6379
              AWS_REGION: garage
              S3_BUCKET: send
              S3_ENDPOINT: s3.layertwo.dev
              S3_USE_PATH_STYLE_ENDPOINT: true
            envFrom:
              - secretRef:
                  name: secrets-send-s3
              - secretRef:
                  name: secrets-send-redis

    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            enabled: true
            port: 8080
            protocol: HTTP
