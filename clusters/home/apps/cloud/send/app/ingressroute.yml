---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: send
  namespace: send
  annotations:
    external-dns.alpha.kubernetes.io/enabled: "true"
    external-dns.alpha.kubernetes.io/hostname: "send.layertwo.dev"
    external-dns.alpha.kubernetes.io/target: "proxy-external.layertwo.dev"
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    kubernetes.io/ingress.class: external
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`send.layertwo.dev`)
    kind: Rule
    middlewares:
    - name: ak-outpost-proxy
      namespace: authentik
    priority: 10
    services:
    - name: send
      port: 8080
      serversTransport: send-transport
  - kind: Rule
    match: "Host(`send.layertwo.dev`) && PathPrefix(`/outpost.goauthentik.io/`)"
    priority: 15
    services:
      - name: ak-outpost-proxy
        namespace: authentik
        port: 9000