---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ollama
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ollama
      version: 1.91.0
      sourceRef:
        kind: HelmRepository
        name: ollama
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"

    # gpu.enabled is deliberately off: it would add a nvidia.com/gpu resource limit,
    # and this cluster runs no device plugin. The card is reached via runtimeClassName
    # plus NVIDIA_VISIBLE_DEVICES, the same way jellyfin does it.
    runtimeClassName: nvidia
    ollama:
      gpu:
        enabled: false
    nodeSelector:
      feature.node.kubernetes.io/pci-0300_10de.present: "true"

    extraEnv:
      - name: NVIDIA_VISIBLE_DEVICES
        value: all
      - name: NVIDIA_DRIVER_CAPABILITIES
        value: all
      - name: OLLAMA_MAX_LOADED_MODELS
        value: "1"
      - name: OLLAMA_NUM_PARALLEL
        value: "1"
      - name: OLLAMA_KEEP_ALIVE
        value: 5m
      - name: OLLAMA_FLASH_ATTENTION
        value: "1"
      # Qwen3.5 head_dim is 256, so KV costs 128 KiB/token at f16 and ollama
      # auto-sizes to 4096. q8_0 halves it; 16384 then fits in ~1 GiB.
      # q8_0 requires flash attention above.
      - name: OLLAMA_KV_CACHE_TYPE
        value: q8_0
      - name: OLLAMA_CONTEXT_LENGTH
        value: "16384"

    # local-path (NVMe) over NFS: 2.4 GB/s vs 47 MB/s, so a cold model load is
    # seconds instead of 2m14s. Weights are re-downloadable, and the GPU
    # nodeSelector already pins this pod to node-nv1, so node-local costs nothing.
    # Not backed up by design. local-path does not enforce the size request.
    persistentVolume:
      enabled: true
      size: 60Gi
      storageClass: local-path
      accessModes:
        - ReadWriteOnce

    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        memory: 8Gi
