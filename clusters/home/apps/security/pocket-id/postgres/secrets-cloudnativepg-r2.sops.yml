# PLAINTEXT — encrypt before committing:
#   sops -e -i clusters/home/apps/security/pocket-id/postgres/secrets-cloudnativepg-r2.sops.yml
#
# Reuse the existing R2 credentials that cnpg-immich already backs up with (the same
# layertwo-dev-cloudnativepg bucket, distinguished by serverName: pocket-id). Secrets are
# namespace-scoped, so immich's copy cannot be referenced from ns pocket-id — hence this
# namespace-local duplicate. Use an R2 token scoped to this prefix if you want least privilege.
apiVersion: v1
kind: Secret
metadata:
  name: secrets-cloudnativepg-r2
  namespace: pocket-id
type: Opaque
stringData:
  ACCESS_KEY_ID: "REPLACE_ME"
  SECRET_ACCESS_KEY: "REPLACE_ME"
