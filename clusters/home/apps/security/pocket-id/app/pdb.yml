---
# Pocket ID cannot run more than one replica on v2.14.0 and NO environment variable can change
# that. HAEnabled is a bare Go struct field with no env binding -- its own code comment reads
# "intentionally not bound to an environment variable ... TODO: Add env var when HA mode is
# ready" -- so it is always false, the francis actor host registers with max-hosts 1, and a
# second replica exits with ErrClusterFull -> os.Exit(1) -> CrashLoopBackOff. That is the
# blocker, tracked upstream in pocket-id/pocket-id#1549 (milestone 3.0.0). The JWT signing-key
# race #1549 also tracks is unreachable while max-hosts is 1 and is fixed only on main (PR
# #1733); it becomes live the moment HA is switched on.
#
# KEYS_STORAGE and DB_PROVIDER never existed in v2.x -- they were silently dropped. Do not read
# them as evidence of anything. The filesystem prerequisite in #1549 DOES apply, which is why
# FILE_BACKEND is now set explicitly rather than left to its 'filesystem' default.
#
# Until HA lands a PDB is the only availability protection available. minAvailable: 1 refuses
# eviction of the sole replica, so ALLOWED DISRUPTIONS is 0 and an un-forced node drain hangs by
# design -- use `kubectl drain --disable-eviction`, or delete this PDB first. Do NOT add
# replicas: a second pod CrashLoopBackOffs on ErrClusterFull and cannot serve traffic.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
      app.kubernetes.io/instance: pocket-id
