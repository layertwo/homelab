---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: gatus
      version: 1.5.0
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
  values:
    annotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: twinproduction/gatus
      tag: latest

    env:
      PUSHOVER_TOKEN:
        valueFrom:
          secretKeyRef:
            name: gatus-pushover
            key: PUSHOVER_TOKEN
      PUSHOVER_USER_KEY:
        valueFrom:
          secretKeyRef:
            name: gatus-pushover
            key: PUSHOVER_USER_KEY
      POSTGRES_URI:
        valueFrom:
          secretKeyRef:
            name: cnpg-gatus-app
            key: uri
      OIDC_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: gatus-oidc
            key: CLIENT_ID
      OIDC_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: gatus-oidc
            key: CLIENT_SECRET

    persistence:
      config:
        enabled: true
        type: hostPath
        hostPath: /config
        hostPathType: Directory
        readOnly: true

    service:
      main:
        ports:
          https:
            port: 8080

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    config:
      storage:
        type: postgres
        path: "${POSTGRES_URI}"

      endpoints:

        - name: PocketID
          group: Authentication
          url: https://idp.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "PocketID is down"

        # Photo Management Services
        - name: Immich
          group: Photo Management
          url: https://immich.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Immich is down"

        # Mediabox Services
        - name: Jellyfin
          group: Mediabox
          url: https://jellyfin.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Jellyfin is down"

        # Home Automation Services
        - name: Home Assistant
          group: Home Automation
          url: https://hass.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Home Assistant is down"

        - name: Bazarr
          group: Mediabox
          url: https://bazarr.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 401"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Bazarr is down"

        - name: Prowlarr
          group: Mediabox
          url: https://prowlarr.layertwo.dev/ping
          interval: 1m
          conditions:
            - "[STATUS] == 200"
            - "[BODY].status == OK"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Prowlarr is down"

        - name: qBittorrent
          group: Mediabox
          url: https://qt.layertwo.dev/api/v2/app/version
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "qBittorrent is down"

        - name: Radarr
          group: Mediabox
          url: https://radarr.layertwo.dev/ping
          interval: 1m
          conditions:
            - "[STATUS] == 200"
            - "[BODY].status == OK"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Radarr is down"

        - name: Sonarr
          group: Mediabox
          url: https://sonarr.layertwo.dev/ping
          interval: 1m
          conditions:
            - "[STATUS] == 200"
            - "[BODY].status == OK"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Sonarr is down"

        # Home Automation Services (continued)
        - name: MQTT Dashboard
          group: Home Automation
          url: https://mqtt-dashboard.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "MQTT Dashboard is down"

        - name: MQTT
          group: Home Automation
          url: tcp://mqtt-listeners.home-assistant.svc.cluster.local:1883
          interval: 1m
          conditions:
            - "[CONNECTED] == true"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "MQTT is down"

        - name: Zigbee2MQTT
          group: Home Automation
          url: https://zigbee.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Zigbee2MQTT is down"

        - name: Z-Wave JS UI
          group: Home Automation
          url: https://zwave.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Z-Wave JS UI is down"

        - name: TrueNAS
          group: Storage
          url: https://sunbeam.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "TrueNAS is down"

        - name: Send
          group: Storage
          url: https://send.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 401"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Send is down"

        - name: Garage S3
          group: Storage
          url: https://s3.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 403"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Garage is down"

        - name: Garage S3 Website
          group: Storage
          url: https://nonexistent-bucket.s3-website.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 404"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Garage website is down"

        # Network Services
        - name: Traefik External
          group: Network
          url: https://traefik-external.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: false
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Traefik External is down"

        - name: Traefik Internal
          group: Network
          url: https://traefik-internal.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true
              description: "Traefik Internal is down"

      alerting:
        pushover:
          application-token: "${PUSHOVER_TOKEN}"
          user-key: "${PUSHOVER_USER_KEY}"

      security:
        oidc:
          issuer-url: https://idp.layertwo.dev
          client-id: "${OIDC_CLIENT_ID}"
          client-secret: "${OIDC_CLIENT_SECRET}"
          redirect-url: "https://status.layertwo.dev/authorization-code/callback"
          scopes: [openid]
