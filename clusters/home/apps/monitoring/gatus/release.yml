---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: gatus
      version: 1.3.0
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
  values:
    annotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: twinproduction/gatus
      tag: latest

    env:
      PUSHOVER_TOKEN:
        valueFrom:
          secretKeyRef:
            name: gatus-pushover
            key: PUSHOVER_TOKEN
      PUSHOVER_USER_KEY:
        valueFrom:
          secretKeyRef:
            name: gatus-pushover
            key: PUSHOVER_USER_KEY
      POSTGRES_URI:
        valueFrom:
          secretKeyRef:
            name: cnpg-gatus-app
            key: uri

    persistence:
      config:
        enabled: true
        type: hostPath
        hostPath: /config
        hostPathType: Directory
        readOnly: true

    service:
      main:
        ports:
          https:
            port: 8080

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    config:
      storage:
        type: postgres
        path: "${POSTGRES_URI}"

      endpoints:
        # Documentation Services
        - name: Outline
          group: Documentation
          url: https://outline.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Outline is down"

        # Authentication Services
        - name: Authentik
          group: Authentication
          url: https://authentik.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Authentik is down"

        - name: Vaultwarden
          group: Authentication
          url: https://vault.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Vaultwarden is down"

        # Photo Management Services
        - name: Immich
          group: Photo Management
          url: https://immich.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Immich is down"

        # Media Management Services
        - name: Jellyfin
          group: Media Management
          url: https://jellyfin.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Jellyfin is down"

        # Home Automation Services
        - name: Home Assistant
          group: Home Automation
          url: https://hass.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Home Assistant is down"

        # Media Management Services (continued)
        - name: Bazarr
          group: Media Management
          url: https://bazarr.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Bazarr is down"

        - name: Prowlarr
          group: Media Management
          url: https://prowlarr.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Prowlarr is down"

        - name: qBittorrent
          group: Media Management
          url: https://qt.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "qBittorrent is down"

        - name: Radarr
          group: Media Management
          url: https://radarr.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Radarr is down"

        - name: Sonarr
          group: Media Management
          url: https://sonarr.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Sonarr is down"

        # Home Automation Services (continued)
        - name: MQTT Dashboard
          group: Home Automation
          url: https://mqtt-dashboard.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "MQTT Dashboard is down"

        - name: MQTT
          group: Home Automation
          url: tcp://mqtt-listeners.home-assistant.svc.cluster.local:1883
          interval: 1m
          conditions:
            - "[CONNECTED] == true"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "MQTT is down"

        - name: Zigbee2MQTT
          group: Home Automation
          url: https://zigbee.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Zigbee2MQTT is down"

        - name: Z-Wave JS UI
          group: Home Automation
          url: https://zwave.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Z-Wave JS UI is down"

        # Monitoring Services
        - name: Grafana
          group: Monitoring
          url: https://monitoring.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Grafana is down"

        # Storage Services
        - name: MinIO S3
          group: Storage
          url: https://s3.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "MinIO S3 is down"

        - name: MinIO Console
          group: Storage
          url: https://console.s3.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "MinIO Console is down"

        - name: TrueNAS
          group: Storage
          url: https://sunbeam.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "TrueNAS is down"

        - name: Send
          group: Storage
          url: https://send.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Send is down"

        # Network Services
        - name: Traefik External
          group: Network
          url: https://traefik-external.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Traefik External is down"

        - name: Traefik Internal
          group: Network
          url: https://traefik-internal.layertwo.dev
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "Traefik Internal is down"

        # Authentication Services (continued)
        - name: LDAP
          group: Authentication
          url: tcp://ldap.internal.layertwo.dev:389
          interval: 1m
          conditions:
            - "[CONNECTED] == true"
          alerts:
            - type: pushover
              enabled: true
              failure-threshold: 3
              success-threshold: 2
              description: "LDAP outpost is down"

      alerting:
        pushover:
          application-token: "${PUSHOVER_TOKEN}"
          user-key: "${PUSHOVER_USER_KEY}"
