---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      version: 1.10.1
  interval: 60m
  values:
    longhornManager:
      nodeSelector:
        location: home
    longhornDriver:
      nodeSelector:
        location: home
    longhornUI:
      nodeSelector:
        location: home
