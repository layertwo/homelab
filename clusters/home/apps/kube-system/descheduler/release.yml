---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: descheduler
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    replicas: 2
    kind: Deployment
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    deschedulerPolicy:
      profiles:
        - name: Default
          pluginConfig:
            - name: DefaultEvictor
              args:
                evictFailedBarePods: true
                evictLocalStoragePods: true
                # false since LowNodeUtilization was added: that plugin evicts on
                # utilization alone, which would make system-critical pods fair game
                # for a purely cosmetic rebalance. The constraint-violation plugins
                # never matched them anyway, so nothing is lost.
                evictSystemCriticalPods: false
                nodeFit: true
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingTopologySpreadConstraint
              args:
                constraints:
                  - DoNotSchedule
                  - ScheduleAnyway
            # Spreads load onto under-used nodes. Without this the descheduler only
            # evicts constraint *violations*, so an empty new node stays empty — it
            # violates nothing. Percentages are of each node's own allocatable, which
            # matters here: node-nv1 has 12 CPU vs 4 on node1-3.
            #
            # A node must be under EVERY `thresholds` value to receive pods, and over
            # ANY `targetThresholds` value to shed them. Nodes in between are left alone.
            #
            # Utilization is measured from pod *requests*, not live usage — so a node
            # can read as full while idle if its pods over-request.
            - name: LowNodeUtilization
              args:
                thresholds:
                  cpu: 30
                  memory: 30
                  pods: 30
                targetThresholds:
                  cpu: 60
                  memory: 70
                  pods: 60
                # The first run evicted 34 pods at once and took Forgejo down; RWO volumes
                # cannot all detach and reattach simultaneously. Rebalance over several
                # cycles instead — same end state, no storm.
                evictionLimits:
                  node: 3
          plugins:
            balance:
              enabled:
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
            deschedule:
              enabled:
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    leaderElection:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 256Mi
