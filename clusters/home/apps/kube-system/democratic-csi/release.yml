apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-nfs
  namespace: democratic-csi
spec:
  chart:
    spec:
      chart: democratic-csi
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
      version: 0.15.1
  interval: 60m
  valuesFrom:
    - targetPath: driver.config.httpConnection.apiKey
      kind: Secret
      name: truenas-api-secret
      valuesKey: apiKey
  values:
    csiDriver:
      name: org.democratic-csi.nfs
      fsGroupPolicy: File
    storageClasses:
      - name: sunbeam-nfs-csi
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
        mountOptions:
          - noatime
          - nfsvers=4
        secrets:
          provisioner-secret: null
          controller-publish-secret: null
          node-stage-secret: null
          node-publish-secret: null
          controller-expand-secret: null
    driver:
      config:
        driver: freenas-api-nfs
        instance_id: null
        httpConnection:
          protocol: https
          host: 172.31.0.9
          port: 443
          allowInsecure: true
          apiVersion: 2
        zfs:
          datasetParentName: storage0/kubernetes/persistent-volume/nfs/volumes
          detachedSnapshotsDatasetParentName: storage0/kubernetes/persistent-volume/nfs/snapshots
          datasetEnableQuotas: true
          datasetEnableReservation: false
          datasetPermissionsMode: "0777"
          datasetPermissionsUser: 3001
          datasetPermissionsGroup: 3001
        nfs:
          shareHost: 172.31.0.9
          shareAlldirs: false
          # Stamped onto each NFS export at volume-creation time ONLY — editing this
          # does not touch existing shares. After adding a node here, backfill with
          # bootstrap/fix-nfs-share-hosts.py or the new node cannot mount old volumes.
          # .40/.41 removed 2026-08-23: those hosts no longer exist.
          shareAllowedHosts:
            - 172.31.0.10
            - 172.31.0.11
            - 172.31.0.12
            - 172.31.0.18
          shareAllowedNetworks: []
          shareMaprootUser: root
          shareMaprootGroup: wheel
          shareMapallUser: ""
          shareMapallGroup: ""
    controller:
      enabled: true
      driver:
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          tag: next
        enabled: true
        logLevel: debug
      csiProxy:
        image:
          registry: ghcr.io/democratic-csi/csi-grpc-proxy
          tag: v0.5.6
