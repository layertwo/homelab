---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  layertwo.server: |
    layertwo.dev:53 {
        hosts {
            172.31.0.10 node1.layertwo.dev
            172.31.0.11 node2.layertwo.dev
            172.31.0.12 node3.layertwo.dev
            172.31.0.18 node-nv1.layertwo.dev
            fallthrough
        }
        forward . 172.31.0.1
        cache 30
    }
