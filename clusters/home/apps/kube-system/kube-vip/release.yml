---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-vip
      version: 0.11.0
      sourceRef:
        kind: HelmRepository
        name: kube-vip
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    config:
      address: 172.31.0.19
    env:
      vip_interface: eno1
      cp_enable: "true"
      cp_namespace: kube-system
      svc_enable: "false"
      lb_enable: "false"
      vip_arp: "true"
      vip_leaderelection: "true"
      port: "6443"
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
