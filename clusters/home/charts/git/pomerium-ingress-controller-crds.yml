---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: pomerium-ingress-controller-crds
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/pomerium/ingress-controller.git
  ref:
    tag: v0.32.3
  ignore: |
    # exclude all
    /*
    # include config directory and its contents
    !/config
    !/config/**
