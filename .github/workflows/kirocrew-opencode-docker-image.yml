name: kirocrew-opencode

on:
  workflow_dispatch:
  push:
    branches: [ "mainline" ]
    paths:
      - containers/kirocrew-opencode/**
      - .github/workflows/kirocrew-opencode-docker-image.yml
  pull_request:
    branches: [ "mainline" ]
    paths:
      - containers/kirocrew-opencode/**
      - .github/workflows/kirocrew-opencode-docker-image.yml

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/layertwo/kirocrew-opencode:latest

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./containers/kirocrew-opencode

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        # 3.12 to match the KiroCrew base image (PYTHON_VERSION=3.12.13), which
        # is where the shim actually runs.
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          black --check src tests
          isort --check-only src tests
          flake8 src tests

      - name: Run tests
        run: pytest --junitxml=reports/results.xml

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: containers/kirocrew-opencode/reports/results.xml

  package:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/mainline')

    permissions:
          contents: read
          packages: write
          id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Install cosign
      if: github.event_name != 'pull_request'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Log into registry ${{ env.REGISTRY }}
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      id: build-and-push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: containers/kirocrew-opencode
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.IMAGE }}
        # linux/amd64 only for now: the arm64 leg needs QEMU emulation to run
        # `opencode --version` and `kirocrew-shim --version`, which makes the
        # build minutes-long. Add setup-qemu-action + platforms if an arm64 node
        # ever needs to run this.
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Sign the published Docker image
      if: ${{ github.event_name != 'pull_request' }}
      # NOTE: referencing env.IMAGE rather than a metadata-action output, which
      # the sibling workflows use but never define -- there TAGS is empty and
      # nothing actually gets signed.
      env:
        IMAGE_REF: ${{ env.IMAGE }}
        DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: cosign sign --yes "${IMAGE_REF%%:*}@${DIGEST}"
