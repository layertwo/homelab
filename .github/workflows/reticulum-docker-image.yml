name: reticulum

on:
  workflow_dispatch:
  push:
    branches: [ "mainline" ]
    paths:
      - containers/reticulum/**
      - .github/workflows/reticulum-docker-image.yml
  pull_request:
    branches: [ "mainline" ]
    paths:
      - containers/reticulum/**
      - .github/workflows/reticulum-docker-image.yml

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/layertwo/reticulum:latest

jobs:

  package:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/mainline' || github.event_name == 'workflow_dispatch'

    permissions:
          contents: read
          packages: write
          id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Install cosign
      if: github.event_name != 'pull_request'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Log into registry ${{ env.REGISTRY }}
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      id: build-and-push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: containers/reticulum
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.IMAGE }}
        # linux/amd64 only: all cluster nodes are amd64, matching kirocrew-opencode.
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Sign the published Docker image
      if: ${{ github.event_name != 'pull_request' }}
      env:
        IMAGE_REF: ${{ env.IMAGE }}
        DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: cosign sign --yes "${IMAGE_REF%%:*}@${DIGEST}"
