name: oidc-saml-bridge

on:
  workflow_dispatch:
  push:
    branches: [ "mainline" ]
    paths:
      - containers/oidc-saml-bridge/**
      - .github/workflows/oidc-saml-bridge-docker-image.yml
  pull_request:
    branches: [ "mainline" ]
    paths:
      - containers/oidc-saml-bridge/**
      - .github/workflows/oidc-saml-bridge-docker-image.yml

env:
  REGISTRY: ghcr.io

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./containers/oidc-saml-bridge

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          black --check src tests
          isort --check-only src tests
          flake8 src tests

      - name: Run tests
        run: pytest --junitxml=reports/results.xml

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: containers/oidc-saml-bridge/reports/results.xml

  package:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/mainline')

    permissions:
          contents: read
          packages: write
          id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Install cosign
      if: github.event_name != 'pull_request'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log into registry ${{ env.REGISTRY }}
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      id: build-and-push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: containers/oidc-saml-bridge
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/layertwo/oidc-saml-bridge:latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Sign the published Docker image
      if: ${{ github.event_name != 'pull_request' }}
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
