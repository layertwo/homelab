name: oidc-saml-bridge

on:
  workflow_dispatch:
  push:
    branches: [ "mainline" ]
    paths:
      - containers/oidc-saml-bridge/**
      - .github/workflows/oidc-saml-bridge-docker-image.yml
  pull_request:
    branches: [ "mainline" ]
    paths:
      - containers/oidc-saml-bridge/**
      - .github/workflows/oidc-saml-bridge-docker-image.yml

env:
  REGISTRY: ghcr.io

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./containers/oidc-saml-bridge

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          black --check src tests
          isort --check-only src tests
          flake8 src tests

      - name: Run tests
        run: pytest --junitxml=reports/results.xml

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: containers/oidc-saml-bridge/reports/results.xml

  package:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/mainline')

    permissions:
          contents: read
          packages: write
          id-token: write

    steps:
    - uses: actions/checkout@v6

    - name: Install cosign
      if: github.event_name != 'pull_request'
      uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Log into registry ${{ env.REGISTRY }}
      if: github.event_name != 'pull_request'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      id: build-and-push
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: containers/oidc-saml-bridge
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/layertwo/oidc-saml-bridge:latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Sign the published Docker image
      if: ${{ github.event_name != 'pull_request' }}
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
