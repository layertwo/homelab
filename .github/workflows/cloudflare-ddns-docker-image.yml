name: cloudflare-ddns

on:
  workflow_dispatch:
  push:
    branches: [ "mainline" ]
    paths:
      - containers/cloudflare-ddns/**
      - .github/workflows/cloudflare-ddns-docker-image.yml
  pull_request:
    branches: [ "mainline" ]
    paths:
      - containers/cloudflare-ddns/**
      - .github/workflows/cloudflare-ddns-docker-image.yml

env:
  REGISTRY: ghcr.io

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./containers/cloudflare-ddns

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run linting
        run: |
          black --check src tests
          isort --check-only src tests
          flake8 src tests

      - name: Run tests
        run: pytest --junitxml=reports/results.xml

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: containers/cloudflare-ddns/reports/results.xml

  package:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/mainline')

    permissions:
          contents: read
          packages: write
          id-token: write

    steps:
    - uses: actions/checkout@v6

    - name: Install cosign
      if: github.event_name != 'pull_request'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: 'v2.1.1'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Log into registry ${{ env.REGISTRY }}
      if: github.event_name != 'pull_request'
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      id: build-and-push
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: containers/cloudflare-ddns
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/layertwo/cloudflare-ddns:latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Sign the published Docker image
      if: ${{ github.event_name != 'pull_request' }}
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
